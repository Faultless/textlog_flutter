name: textlog
description: A community-built mobile client for textlog.cc
publish_to: 'none'
version: 0.0.4+4

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  http: ^1.2.2
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  web: ^1.1.1 # EventSource, for the firehose on Flutter web
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.2

# Generated from textlog's caret mark. Regenerate with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#171a17"
  adaptive_icon_foreground: assets/icon/icon-foreground.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  # Bundled rather than relying on a generic `monospace` family: Flutter web's
  # CanvasKit renderer only resolves fonts it has been given, so the site's
  # defining monospace look has to ship with the app.
  fonts:
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono.ttf
