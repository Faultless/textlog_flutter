name: textlog
description: A community-built mobile client for textlog.cc
publish_to: 'none'
version: 0.7.2+25

environment:
  sdk: ^3.11.3
  # The floor, for anyone building this. The *exact* version releases are built with
  # is pinned once, in .github/workflows/pages.yml, because a packager needs a single
  # unambiguous string to check out — see fdroid/README.md.
  flutter: '>=3.41.5'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_math_fork: ^0.7.4 # TeX -> Flutter widgets, no webview, works on web
  go_router: ^14.6.2
  http: ^1.2.2
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.1
  web: ^1.1.1 # EventSource, for the firehose on Flutter web
  # Notifications. The server has no push endpoint an app can reach, so these are
  # raised locally from a background poll — see ARCHITECTURE.md.
  flutter_local_notifications: ^22.3.0
  workmanager: ^0.10.9
  flutter_web_plugins:
    sdk: flutter
  just_audio: ^0.10.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.2

# Generated from textlog's caret mark. Regenerate with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#171a17"
  adaptive_icon_foreground: assets/icon/icon-foreground.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  # Bundled rather than relying on a generic `monospace` family: Flutter web's
  # CanvasKit renderer only resolves fonts it has been given, so the site's
  # defining monospace look has to ship with the app.
  #
  # Both are subset to Latin, punctuation, arrows, maths, box drawing and blocks —
  # everything textlog's ASCII art needs, and nothing else. Regenerate with
  # `pyftsubset <font>.ttf --unicodes=... --layout-features='*'`.
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
    - family: FiraCode
      fonts:
        - asset: assets/fonts/FiraCode.ttf
